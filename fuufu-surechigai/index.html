  <script>
const typeColors={A:{gradient:'linear-gradient(135deg,#C2410C 0%,#FDBA74 100%)'},B:{gradient:'linear-gradient(135deg,#7C3AED 0%,#C4B5FD 100%)'},C:{gradient:'linear-gradient(135deg,#2563EB 0%,#93C5FD 100%)'},D:{gradient:'linear-gradient(135deg,#DB2777 0%,#F9A8D4 100%)'},E:{gradient:'linear-gradient(135deg,#059669 0%,#86EFAC 100%)'},F:{gradient:'linear-gradient(135deg,#D97706 0%,#FDE68A 100%)'},G:{gradient:'linear-gradient(135deg,#4F46E5 0%,#A5B4FC 100%)'},H:{gradient:'linear-gradient(135deg,#6B7280 0%,#D1D5DB 100%)'}};
const LEVELS=[{label:'とても当てはまる',sub:'かなり近い',weight:3},{label:'少し当てはまる',sub:'まあ近い',weight:2},{label:'あまり当てはまらない',sub:'少し違う',weight:1},{label:'ほとんど当てはまらない',sub:'かなり違う',weight:0}];
const Q=[
['夫に家事や育児を頼むより、自分で済ませた方が早いと思う',{A:3}],
['家族の予定や必要な物などを、自分ばかりが把握していると感じる',{B:3}],
['自分から言わなくても、夫に負担や疲れを察してほしいと思う',{C:3}],
['夫と話し合っても、自分が伝えたかったこととは違う話になりやすい',{D:3}],
['夫が休んでいる姿を見ると、自分には休む時間がないと感じる',{E:3}],
['夫の何気ない言葉や態度をきっかけに、以前の不満まで思い出す',{F:3}],
['家事や育児を頼むために、手順まで説明することを負担に感じる',{G:3}],
['言い争いや不満を伝えた後、夫と普段どおりに接するまで時間がかかる',{H:3}],
['家事や育児を「手伝う」のではなく、夫にも担当者として担ってほしい',{B:2,A:1}],
['同じお願いを繰り返すうちに、夫へ伝えること自体を諦めたくなる',{G:2,D:1}],
['夫に悪気がないと分かっていても、自分の負担が軽くならず不満が残る',{C:2,F:1}],
['夫婦の問題を話し合う前に、「自分に余裕がないだけ」と片づけてしまう',{H:2,E:1}]
];
const T={
A:['先回り抱え込みタイプ','イライラの奥には、「頼む前に自分が動いてしまう疲れ」があるのかもしれません','夫に頼めばいい。そう頭では分かっていても、説明するより自分でやった方が早い。待つより動いた方が確実。そんな判断を何度もしてきたのではないでしょうか。\n\nこのタイプのすれ違いは、夫が何もしないという単純な話だけではありません。あなたが先に気づき、先に動き、先に整えてしまうことで、周りからは「回っている」ように見えやすいんです。でもその裏側では、あなたの負担だけが静かに増えています。イライラは、頼れない自分への苛立ちではなく、先回りし続けてきた疲れのサインかもしれません。','ここまで本当によく回してきました。早く気づける人ほど、動く量も増えてしまうんですよね。', '今日はひとつだけ、先に動く前に止まってみてください。「これは今、私がやる必要がある？」と一拍置くだけで、流れは少し変えられます。'],
B:['見えない管理疲れタイプ','あなたの疲れは、作業そのものより「覚えていることの多さ」にあるのかもしれません','買うもの、提出物、予定、子どもの様子、家の在庫、次に必要な準備。実際に手を動かす前から、頭の中ではずっと家のことが動いている。そんな感覚がありませんか。\n\nこのタイプのすれ違いは、目に見える家事量だけでは測れません。誰が覚えているか、誰が先に気づくか、誰が段取りしているか。そこが偏っていると、「やってくれているのにしんどい」という状態になります。夫が手伝ってくれても、管理者がずっと自分なら疲れは残ります。','作業を分けたいだけではなく、頭の中の負担も分けたかったんですよね。そこに気づいてほしかったのだと思います。','次に頼むときは、作業だけでなく「これは覚えておくところからお願いしたい」と伝えてみてください。管理ごと渡すのがポイントです。'],
C:['察してほしい疲れタイプ','「言えばいい」では片づかない、気づいてほしさの疲れが積もっているのかもしれません','言えばやってくれる。でも、言わないと気づかない。何度もそういう場面が続くと、「言えばいいじゃん」という言葉自体がしんどくなります。\n\nこのタイプのイライラの奥には、作業の不満だけでなく「同じ景色を見てほしい」という願いがあります。私だけが気づいている。私だけが先に困っている。そんな孤独感が、怒りの形で出やすいのです。察してほしいと思うのは甘えではなく、同じ家を一緒に見てほしいという自然な気持ちかもしれません。','本当は、全部を言葉にしなくても一緒に気づいてほしかったんですよね。そう思うのは自然です。','「なんで気づかないの」ではなく、「ここに一緒に気づいてほしい」と言い換えてみてください。責めより共有に近づけると、少し届きやすくなります。'],
D:['会話すれ違いタイプ','話し合いたいのに、会話がかみ合わない疲れが大きいのかもしれません','説明したいのに、途中で論点がずれる。気持ちを話したいのに、正論や解決策が返ってくる。結果として、話す前より疲れてしまうことはありませんか。\n\nこのタイプのすれ違いは、話し合い不足というより、話したい層が違うことで起きやすいです。あなたは気持ちを分かってほしいのに、相手は方法を直そうとする。あなたは受け止めてほしいのに、相手は結論を急ぐ。そのズレが続くと、話すこと自体に疲れてしまいます。','伝えようとしてきたこと自体が、もう十分頑張った証拠です。かみ合わない会話は本当に消耗します。','話す前に「今日は解決策より、まず聞いてほしい」と前置きしてみてください。会話の目的を先にそろえるだけで、ズレは少し減ります。'],
E:['休めなさ比較タイプ','夫の休み方を見るほど、自分の休めなさが浮き上がってしまうのかもしれません','夫がスマホを見ている。横になっている。自分のタイミングで休んでいる。その姿を見ると、なぜ自分は同じように休めないのかとモヤモヤすることがありませんか。\n\nこのタイプのイライラは、夫が休むこと自体への怒りだけではありません。自分には休む許可がないように感じること、自分の休みが細切れで終わること、その差がつらいのです。相手が悪気なく休んでいるほど、自分の我慢が見えにくくなり、余計に苦しくなることがあります。','あなたも休みたかったんですよね。誰かが休む姿を見てつらくなるのは、自分の休みが足りていないサインです。','「手伝って」ではなく「私も30分休みたい」と休みそのものを予定にして伝えてみてください。休む権利を作業の後回しにしないことが大事です。'],
F:['積もり積もった反応タイプ','今のイライラは、目の前の一言ではなく過去の積み重ねに反応しているのかもしれません','小さな言い方、返事の薄さ、何気ない態度。普通なら流せることでも、急に強く反応してしまう。あとから考えると、そこまで怒ることではなかったかもと思う。でも、その瞬間は止まらない。\n\nこのタイプは、目の前の出来事だけで怒っているわけではありません。過去に飲み込んだ不満、言えなかったこと、分かってもらえなかったことが、今の場面で一気に反応している可能性があります。怒りが大きいのは、今の出来事が大きいからではなく、積もっていたものが多かったからかもしれません。','急に怒ったように見えても、あなたの中では急ではなかったんですよね。ずっと残っていたものがあったのだと思います。','イライラした後で、「今の怒りは何回目の怒りだった？」と考えてみてください。過去の分と今の分を分けると、伝える内容が少し整理されます。'],
G:['指示出し疲れタイプ','頼むたびに説明や確認が必要で、結局自分の負担が残っているのかもしれません','やってくれるのはありがたい。でも、どこにあるか、どうするか、次に何をするかを毎回説明しなければならない。そんな状態が続くと、頼むこと自体が仕事になります。\n\nこのタイプの疲れは、「やってくれない」より少し複雑です。やってくれているのに、自分が司令塔のままになっている。質問されるたびに手が止まり、確認するたびに頭を使う。だから、作業が減っても楽になりきらないのです。','やってくれるならいい、では済まない疲れがありますよね。説明する側に固定されるのは、かなり消耗します。','次は「これをやって」ではなく「最後まで判断込みでお願いしたい」と伝えてみてください。作業ではなく担当を渡す意識です。'],
H:['仲直りしたいのに距離が残るタイプ','本当は近づきたいのに、イライラの後に戻り方が分からなくなるのかもしれません','怒った後、普通に戻りたい。でも素直になれない。相手も何となく距離を取る。会話は戻っても、気持ちだけ少し残る。そんなことはありませんか。\n\nこのタイプのすれ違いは、怒りそのものより「気持ちの戻れなさ」で疲れやすい状態です。本当は仲良くしたい。分かってほしい。けれど、怒った後の空気が残ると、次に話すことも難しくなります。イライラの奥には、関係を壊したい気持ちではなく、うまく戻りたい気持ちがあるのかもしれません。','距離を置きたいわけではなく、戻り方が分からなくなっていたんですよね。関係を大事にしているからこそ、後に残るのだと思います。','長い話し合いでなくて大丈夫です。「さっき強く言ったけど、本当は一緒に考えたかった」と一言だけ戻してみてください。修復は短くても始められます。']
};
