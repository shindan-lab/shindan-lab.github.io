  <script>
const typeColors={A:{gradient:'linear-gradient(135deg,#7C3AED 0%,#A78BFA 100%)'},B:{gradient:'linear-gradient(135deg,#D97706 0%,#FBBF24 100%)'},C:{gradient:'linear-gradient(135deg,#059669 0%,#34D399 100%)'},D:{gradient:'linear-gradient(135deg,#2563EB 0%,#60A5FA 100%)'},E:{gradient:'linear-gradient(135deg,#DB2777 0%,#F472B6 100%)'},F:{gradient:'linear-gradient(135deg,#DC2626 0%,#F87171 100%)'},G:{gradient:'linear-gradient(135deg,#6B7280 0%,#9CA3AF 100%)'},H:{gradient:'linear-gradient(135deg,#1D4ED8 0%,#60A5FA 100%)'}};
const TYPE_IMAGE={A:'type-image-A-v1.png',B:'type-image-B-v1.png',C:'type-image-C-v1.png',D:'type-image-D-v1.png',E:'type-image-E-v1.png',F:'type-image-F-v1.png',G:'type-image-G-v1.png',H:'type-image-H-v1.png'};
const Q=[
['疲れているとき、いちばん最初に起きやすいのは？',[['言う前から「どうせ伝わらない」と思う',{A:3}],['とりあえず自分で抱えてしまう',{B:3}],['軽い言い方でなら出せる',{C:3}],['そこまで強い癖はない',{}]]],
['近い人にしんどさをわかってほしいとき、気持ちに近いのは？',[['言わなくても少しくらい気づいてほしい',{D:3}],['話そうとすると涙が出そうになる',{E:3}],['言うと強くなりそうで怖い',{F:3}],['そこまで強くは感じない',{}]]],
['周りからの見え方で近いのは？',[['意外と元気そうに見られやすい',{G:2}],['かなりしんどくなるまで出さない方だ',{G:3}],['言ったのにズレて返ってくることが多い',{H:2}],['そこはあまり当てはまらない',{}]]],
['勇気を出して伝えた後に起きやすいことは？',[['思ったより軽く受け取られてしまう',{H:3}],['やっぱり言わなきゃよかったと思う',{A:2,B:1}],['本気度がうまく伝わっていない気がする',{C:2,G:1}],['そこまで困ることは少ない',{}]]],
['パートナーや家族に疲れを伝える前の気持ちに近いのは？',[['説明するのがもう面倒に感じる',{A:3}],['言う前に「私がやればいいか」となる',{B:3}],['冗談っぽくなら言える',{C:3}],['そこまで迷わず言える',{}]]],
['「なんで気づいてくれないの」と思いやすいのはどんなとき？',[['何も言ってないけど、見ればわかると思うとき',{D:3}],['話そうとすると感情が先に出るとき',{E:3}],['言ったら責めてる空気になったとき',{F:3}],['そこまで強く思うことは少ない',{}]]],
['しんどいのに「大丈夫そう」に見られやすい理由として近いのは？',[['普通に受け答えできてしまうから',{G:3}],['顔に出す前に自分で飲み込みやすいから',{B:2,G:1}],['本気のしんどさを軽く言ってしまうから',{C:2,G:1}],['特に思い当たらない',{}]]],
['疲れを伝えたとき、返ってくるとしんどい言葉に近いのは？',[['「気にしすぎじゃない？」',{H:3}],['「言ってくれないとわからないよ」',{D:2,A:1}],['「そんな言い方しなくても…」',{F:3}],['そこまで刺さる言葉は少ない',{}]]],
['本音を出すタイミングとして近いのは？',[['かなり後になってから出る',{G:3}],['うまくまとまらないまま止まりやすい',{A:2}],['軽めなら出せるけど、本気では出しにくい',{C:3}],['比較的その都度出せる',{}]]],
['誰かに頼りたいとき、一番近い感覚は？',[['頼る前にもう疲れてしまう',{A:2,B:1}],['本当は察して動いてほしい',{D:3}],['頼る言葉が感情っぽくなりやすい',{E:1,F:2}],['そこまで困らない',{}]]],
['いざ話そうとしたときに起きやすいのは？',[['やっぱりやめよう、となる',{A:3}],['「私が頑張ればいいか」で終わる',{B:3}],['軽い言い方に変えてしまう',{C:3}],['比較的そのまま話せる',{}]]],
['もし明日、疲れを少しだけ伝えるなら一番近いのは？',[['短く事実だけ言う',{A:1,B:1}],['本当は察してほしい気持ちがある',{D:3}],['言い方をやわらかくして様子を見る',{C:2,H:1}],['伝えてもズレそうで少し怖い',{H:3}]]]
];
const T={
  A:['言う前に引っ込めるタイプ','本当は言いたいのに、言葉にする手前でもう疲れてしまうのかもしれません','本当はしんどい。ちゃんとわかってほしい。そう思っていても、いざ言葉にしようとすると「どうせ伝わらない」「説明する方が疲れる」「何から言えばいいかわからない」が先に来てしまう。メッセージを書きかけて消したり、話す前にもう諦めたりすることもあるかもしれません。あなたは、伝える前に自分の中で止まりやすいタイプです。\n\nそれは諦めっぽいからではありません。これまでに、うまく伝わらなかった経験や、整理しきれないまま抱えてきたものが積み重なっているからです。言う前から少し身構えてしまうのは、そのぶんちゃんとわかってほしかった証拠でもあります。止まってしまうのは、気持ちが弱いからではなく、伝える前の消耗が大きすぎるからです。','本当は、何度も言おうとしてきたんですよね。でもそのたびに、説明するしんどさの方が大きくなってしまった。まとまらなかったのも、弱いからではなく、抱えていたものが多すぎただけです。','全部を説明しようとしなくて大丈夫です。まずは「今日はちょっと余裕がない」のように、事実だけを一言出す練習から始めてみてください。言葉がまとまらない日は、単語だけでも十分です。'],
  B:['我慢が先に出るタイプ','あなたの疲れが伝わりにくい理由は、「言う前に自分で抱えてしまう」ことです','しんどいときほど、「でも私がやればいいか」「ここで言うほどでもないか」と飲み込んでしまう。助けてほしい気持ちがないわけではないのに、先に我慢が出てきやすい。頼む前に自分で片づけた方が早い、空気を止めるより黙ってやった方が楽、そんな判断を何度も積み重ねてきたのかもしれません。あなたは、そういう抱え方をしやすいタイプです。\n\nこのタイプは、強いから我慢しているのではなく、周りを止めたくない気持ちや、説明の手間を増やしたくない気持ちが先に働いています。だから限界まで見えにくく、自分でも「こんなに溜まっていたんだ」と後から気づきやすいんです。言わないうちに何とかしてしまうぶん、周りも深刻さに気づきにくい。あなたが抱えた分だけ、外からは平気に見えやすかったのかもしれません。','頑張れば回る、を何度も選んできたんですよね。でも、本当はずっと少しずつしんどかったはずです。我慢できることと、我慢していいことは同じではありません。','今日は一回だけ、「手伝ってほしい」ではなく「今ちょっとしんどい」と状態だけ伝えてみてください。我慢を減らす最初の一歩は、お願いより先に状態を見せることです。'],
  C:['軽く包んでしまうタイプ','あなたの疲れが伝わりにくい理由は、「本気のしんどさをやわらかい言葉で包みやすい」ことです','本当はかなり疲れているのに、「ちょっとしんどい」「まあまあ疲れた」くらいで済ませてしまう。冗談っぽく言ったり、笑って流したりして、深刻さを自分で薄めてしまう。相手を心配させすぎないように、無意識に言葉の温度を下げてきたのかもしれません。あなたは、そういう出し方をしやすいタイプです。\n\n軽く言うのは、癖でもあり優しさでもあります。重くしたくない、相手を困らせたくない、その気持ちがあるからです。でも、言葉が軽いと、受け取る側も軽く受け取りやすい。ちゃんとしんどいのに、ちゃんと伝わりきらないのはそのせいかもしれません。あなたがやわらげたぶんだけ、本気度が見えにくくなっていた可能性があります。','やわらかく言ってきたのは、場を重くしたくなかったからなんですよね。気を遣ってきたからこそ、しんどさの強さが見えにくくなってしまっただけです。','次に疲れを伝えるときは、「ちょっと」を一度だけ外してみてください。言い方を少しだけ事実に近づけるだけで、受け取られ方はかなり変わります。'],
  D:['察してほしくなるタイプ','あなたの疲れが伝わりにくい理由は、「言わなくても気づいてほしい」気持ちが強くなりやすいことです','言えばいいと頭ではわかっている。でも、本当に近い人には、言わなくても少しくらい気づいてほしい。顔色や様子を見ればわかるはず、いつもと違うのだから少しは想像してほしい。そんな気持ちがどこかにあって、うまく言葉にしないまますれ違ってしまう。あなたは、そういう疲れ方をしやすいタイプです。\n\nこれは甘えではありません。近い関係だからこそ、説明し続けることに疲れてしまうんです。ちゃんと見ていてほしい、少しは想像してほしい。その気持ちはすごく自然です。ただ、察してほしい気持ちが強いほど、気づかれなかったときの傷つき方も大きくなります。言わなかった悔しさと、気づかれなかった寂しさが重なりやすいタイプとも言えます。','本当は責めたいわけじゃないんですよね。ただ、少しでいいから気づいてほしかった。その願いが何度も空振りしてきたから、余計にしんどかったんだと思います。','全部を説明しなくていいので、「今は察してほしいより、少しだけ助けてほしい」と短く伝えてみてください。察してもらう期待を、少しだけ言葉に置き換えると伝わりやすくなります。'],
  E:['話そうとすると崩れるタイプ','あなたの疲れが伝わりにくい理由は、「話そうとすると感情が先にあふれやすい」ことです','いざ話そうとすると、うまく言葉が出ない。説明したいのに、涙が先に出る。感情が大きくなって、自分でも何から話せばいいかわからなくなる。頭の中では何度も整理していたのに、相手を前にすると急に崩れてしまう。あなたは、そういう出方をしやすいタイプです。\n\nこれは気持ちが整理できていないからではなく、ずっと抑えてきたものが、言葉の出口に来た瞬間に一気にあふれるからです。言えなかった間のしんどさ、わかってほしかった気持ち、もう限界かもしれない不安が、まとめて出てきやすいんです。ちゃんと話せないことを責めなくて大丈夫です。その涙自体が、しんどさの大きさを表しています。言葉より先に感情が出るのは、弱さではなく、抱えてきた量が多かった証拠です。','話そうとした時点で、もう十分頑張っていたんですよね。泣きたかったわけじゃなくて、やっと外に出せるところまで来ただけなんです。','話す前に、箇条書きで3つだけメモしてみてください。「疲れている」「余裕がない」「少し休みたい」のような短い言葉で十分です。言葉の骨組みがあるだけで、感情に飲まれにくくなります。'],
  F:['強く出てしまうタイプ','あなたの疲れが伝わりにくい理由は、「助けてほしい気持ちが強さのある言葉で出やすい」ことです','本当は責めたいわけじゃない。ただ、限界が近いときほど言い方が強くなってしまう。助けてほしいだけなのに、相手には不満や攻撃のように届きやすい。「なんで」「いつも」が先に出てしまったり、言ったあとで自分でもきつかったかもと落ち込んだりすることがあるかもしれません。あなたは、そういうすれ違いが起きやすいタイプです。\n\nこれは性格がきついからではありません。もう余白がない状態で、やっと言葉を出しているからです。余裕が残っているうちに言えなかったぶん、出る頃にはどうしても温度が高くなりやすいんです。助けてほしい気持ちが、最後に強い形でしか出せなくなっている状態とも言えます。','本当は、「なんでわかってくれないの」より「もう少し助けてほしい」だったんですよね。言い方より先に、そこにあった本音を大事にしていいです。','次に伝えるときは、最初の一言を「責め」ではなく「状態」から始めてみてください。たとえば「今かなり余裕がない」だけでも、受け取られ方が少し変わります。'],
  G:['平気そうに見えてしまうタイプ','あなたの疲れが伝わりにくい理由は、「外からはまだ大丈夫そうに見えやすい」ことです','ちゃんとして見える。動けているように見える。笑えてしまうし、受け答えもできる。あるいは、限界近くまで顔に出さずに持ちこたえてしまう。周りから「そんなにしんどそうには見えなかった」と言われやすいなら、あなたは疲れていても崩れ方が外に出にくいタイプです。\n\nこれは無理に取り繕っているというより、そう見えてしまう出方なんです。しんどいのに心配されにくい、気づかれにくい。だからこそ、自分から少し見せないと、なかなか伝わりにくくなります。周りから「急に崩れた」ように見えても、実際にはかなり前から積み重なっていたはずです。見えていなかっただけで、軽かったわけではありません。','ちゃんとして見える人ほど、しんどさを見落とされやすいんですよね。「できているように見える」ことと「平気」は、まったく同じではありません。','元気に振る舞う前に、一度だけ「今日はちょっとしんどい」を先に置いてみてください。先に状態を見せるだけで、周囲の受け取り方が変わることがあります。'],
  H:['伝えてもズレやすいタイプ','あなたの疲れが伝わりにくい理由は、「勇気を出して伝えても、受け止められ方がズレやすい」ことです','やっと言えたのに、返ってきたのは励ましすぎる言葉だったり、軽い受け取りだったり、ズレた解決策だったりする。聞いてほしかっただけなのに助言ばかり返ってくる、助けてほしかったのに「気にしすぎ」と流される。そんな“空振り”が続くと、次第に言うこと自体がしんどくなります。あなたは、そういう傷つき方をしやすいタイプです。\n\nこのタイプは、伝え方だけの問題ではありません。相手との温度差や受け取る力の差も大きく関係します。だから「伝えたのにダメだった」経験が、次の沈黙につながりやすいんです。届かなかった痛みがあるぶん、次に言うハードルも高くなりやすいタイプです。','せっかく出した言葉が、ちゃんと届かなかったらしんどいですよね。それでも伝えようとしてきたこと自体が、もう十分すごいことです。','次に伝えるときは、「聞いてほしいだけなのか」「手伝ってほしいのか」を先に一言添えてみてください。受け取り方のズレを少し減らせることがあります。']
};
const TYPE_MAX={A:17,B:14,C:18,D:14,E:7,F:11,G:10,H:11};
const NEXT={A:{lead:'言う前に止まりやすいなら、疲れ方の土台と職場でのしんどさを見ると、何が言葉を止めているか見えやすくなります。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'伝える前にもう重くなっている疲れ方の土台を見たいときに。'},{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'仕事や人間関係のどこで言えなくなりやすいか見たいときに。'}]},B:{lead:'我慢が先に出やすいなら、広い疲れ方と職場での抱え込みを合わせて見ると、止めどころが見えやすくなります。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'抱え込みやすい疲れ方の土台を見たいときに。'},{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'役割や仕事の中で、どこに負荷が集まりやすいかを見たいときに。'}]},C:{lead:'軽く包んでしまいやすいなら、職場での削られ方と疲れ方の土台を一緒に見ると、言葉の温度を下げる理由が見えやすくなります。',items:[{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'評価や空気で言い方が変わりやすい場面を見たいときに。'},{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'そもそもの消耗の出方を広く見たいときに。'}]},D:{lead:'察してほしくなりやすいなら、疲れ方の土台と職場でのすれ違いを続けて見ると、期待が強くなる場面が整理しやすいです。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'飲み込みや気配の拾いすぎが土台にないか見たいときに。'},{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'人間関係や空気でしんどさが強くなる場面を見たいときに。'}]},E:{lead:'話そうとすると崩れやすいなら、まず疲れ方と回復の入口を見て、言葉の前に状態を整えるのがおすすめです。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'今の消耗の芯がどこにあるかを見たいときに。'},{title:'あなたの回復スイッチ診断',url:'https://shindan-lab.github.io/recovery-switch/',desc:'感情に飲まれにくくなる整え方を知りたいときに。'}]},F:{lead:'強く出てしまいやすいなら、疲れ方の土台と回復の相性を見ると、「きつさの前に何があるか」が見えやすくなります。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'余白切れや飲み込みが背景にないか見たいときに。'},{title:'あなたの回復スイッチ診断',url:'https://shindan-lab.github.io/recovery-switch/',desc:'余白があるうちに戻る方法を知りたいときに。'}]},G:{lead:'平気そうに見えやすいなら、今の疲れ方と職場での削られ方まで見ると、見えにくい消耗の正体がつかみやすいです。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'気づきにくい消耗の土台を広く見たいときに。'},{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'仕事のどこで静かに削られやすいかを見たいときに。'}]},H:{lead:'伝えてもズレやすいなら、疲れ方の土台と職場でのしんどさを合わせて見ると、相手や場との噛み合わなさが整理しやすいです。',items:[{title:'疲れのカルテ',url:'https://shindan-lab.github.io/tsukare-karte/',desc:'そもそもの疲れの芯を広く見たいときに。'},{title:'職場しんどいカルテ',url:'https://shindan-lab.github.io/shokuba-karte/',desc:'仕事や人間関係の中でズレやすい場面を見たいときに。'}]}};
const AFF_HINT={A:'言葉を出す前の負担を少し軽くしたいときの入口として置いています。',B:'我慢が先に出る流れを、少しゆるめたいときに向いています。',C:'本気のしんどさをやわらげすぎないための補助として置いています。',D:'察してほしい気持ちを、少し言葉に置き換えやすくするための入口です。',E:'感情があふれやすいときに、先に外へ出す支えとして使いやすい内容です。',F:'強い言葉の奥にある本音を、少し整えたいときに向いています。',G:'見えにくい無理を、自分でも受け取りやすくするための補助です。',H:'伝え方のズレを少し減らしたいときの入口として置いています。'};
function calc(){const scores={A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};answers.forEach(a=>Object.entries(a).forEach(([k,v])=>{scores[k]+=v;}));const sorted=Object.entries(scores).sort((a,b)=>{const ra=TYPE_MAX[a[0]]?a[1]/TYPE_MAX[a[0]]:0;const rb=TYPE_MAX[b[0]]?b[1]/TYPE_MAX[b[0]]:0;if(rb!==ra)return rb-ra;return b[1]-a[1];});return{main:sorted[0][0],sub:sorted[1][0],ratios:Object.fromEntries(sorted.map(([k,v])=>[k,TYPE_MAX[k]?v/TYPE_MAX[k]:0]))};}
function share(main){const url='https://shindan-lab.github.io/tsutawaranai-tsukare/';return `私は「${T[main][0]}」でした。あなたの伝わりにくさのタイプを診断。\n\n▼伝わらない疲れ診断\n${url}\n\n#伝わらない疲れ診断 #診断Lab`;}
let i=0;let answers=[];
function ensureDynamicBlocks(){const affCard=document.getElementById('aff');if(!document.getElementById('affnote')){const note=document.createElement('div');note.id='affnote';note.className='sub';note.style.marginBottom='12px';affCard.insertBefore(note,document.getElementById('afflink'));}}
function sc(id){['top','quiz','loading','result'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');window.scrollTo({top:0,behavior:'instant'});}
function render(){document.getElementById('ptext').textContent=`${i+1} / ${Q.length}`;document.getElementById('pbar').style.width=`${((i+1)/Q.length)*100}%`;document.getElementById('backbtn').disabled=i===0;document.getElementById('q').textContent=Q[i][0];const o=document.getElementById('opts');o.innerHTML='';Q[i][1].forEach(item=>{const b=document.createElement('button');b.className='opt';b.textContent=item[0];b.onclick=()=>{answers[i]=item[1];if(i<Q.length-1){i+=1;render();return;}sc('loading');setTimeout(show,1200);};o.appendChild(b);});}
function start(){i=0;answers=[];sc('quiz');render();}
function back(){if(i>0){i-=1;render();}}
function show(){const result=calc();const main=T[result.main];ensureDynamicBlocks();document.getElementById('result-accent').style.background=typeColors[result.main].gradient;document.getElementById('result-type-name').textContent=main[0];document.getElementById('result-type-image').src=TYPE_IMAGE[result.main];document.getElementById('result-type-image').alt=`${main[0]}のイメージ画像`;document.getElementById('headline').textContent=main[1];document.getElementById('body').innerHTML=main[2].split('\n\n').map(p=>`<p>${p}</p>`).join('');document.getElementById('letter').textContent=main[3];document.getElementById('pres').textContent=main[4];const affiliate=(typeof affiliateData!=='undefined'&&affiliateData&&affiliateData[result.main]&&typeof affiliateData[result.main].url==='string'&&affiliateData[result.main].url.trim()!=='')?affiliateData[result.main]:null;if(affiliate){document.getElementById('aff').classList.remove('hide');document.getElementById('affnote').textContent=AFF_HINT[result.main];document.getElementById('afft').textContent=affiliate.title;document.getElementById('affd').textContent=affiliate.desc;document.getElementById('afflink').href=affiliate.url;}else{document.getElementById('aff').classList.add('hide');}const shareText=encodeURIComponent(share(result.main));document.getElementById('sx').href=`https://twitter.com/intent/tweet?text=${shareText}`;document.getElementById('st').href=`https://www.threads.net/intent/post?text=${shareText}`;sc('result');}
function resetQuiz(){sc('top');}
