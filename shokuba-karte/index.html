const Q = [

const T = {
  A: ['空気を背負いやすいタイプ', '仕事より先に、場の温度に反応し続けてきたのかもしれません', '会議で誰が何を思っているかをなんとなく拾ってしまう。上司の声色がいつもより少し固いだけで気になる。雑談の温度が低い、誰かが不機嫌そう、返事が短い。そういう小さな変化まで、業務と一緒に受け取って働いているのではないでしょうか。あなたは、仕事の内容だけでなく職場の温度まで処理しながら働いている人です。\n\n空気を読めること自体は大きな力です。気配りができるし、衝突を減らせるし、場をなめらかに回す役にもなれます。でもそれは、常に神経を使う働き方でもあります。相手の不機嫌に自分の原因を探したり、場が荒れないよう先に整えたり、本来は自分が背負わなくていい感情まで受け取り続ければ、しんどくなるのは当然です。', 'あなたが敏感だからこそ、うまく回っていた場面はきっとたくさんあります。でも、場を守る役をずっと引き受けてきた人ほど、静かにすり減っていくんです。疲れるのは、あなたが弱いからではなく、感度の高いまま働き続けてきたからです。', 'まずは一日一回だけ、「これは自分の感情ではない」と心の中で切り分けてみてください。誰かの機嫌まで管理しなくていい、と自分に許可を出すことが回復の第一歩です。'],
  B: ['抱え込みやすいタイプ', 'あなたのしんどさの正体は、『責任感の強さ』がそのまま負荷になっていることです', '頼まれたら断りにくい。任せるより自分でやった方が早い。気づけば仕事が自分のところに集まってきている。急ぎのもの、面倒なもの、止まると困るものほど、自分の前に来やすい。そんな流れが、もう当たり前になっていませんか。あなたは、仕事を回す側に自然となりやすい人です。\n\nそれは能力がある証拠でもあります。でも、できる人のところには仕事が寄ってきます。そして一度それが当たり前になると、周囲も悪気なく頼るようになります。だから、この疲れは単に忙しいだけではありません。「持ててしまう人」が少しずつ役割を増やされ、気づけば戻しにくくなっている構造のしんどさでもあります。', 'ちゃんとやれてしまう人ほど、限界が見えにくいんですよね。周りから見れば頼れる人でも、その中では「これ以上は重い」がずっと続いていたはずです。ここまでよく持ちこたえてきました。', '今日から、頼まれごとに即答しないことを試してみてください。「確認してから返します」を一回挟むだけで、抱え込む流れを少し止められます。'],
  C: ['評価に削られやすいタイプ', 'あなたのしんどさの正体は、『仕事』より見られ方に神経を使いすぎていることです', '上司がどう思ったか、同僚にどう見えたか、返信がそっけなかった意味は何か。少し表情が硬かった、反応が薄かった、他の人と比べて自分はどう映ったのか。仕事の内容そのものより、その先にある評価や印象がずっと気になってしまう。そんな働き方になっていませんか。あなたは、成果だけでなく「見え方」まで背負って働いている人です。\n\n評価を気にすることは悪いことではありません。むしろ真面目だからこそです。ただ、評価への意識が強すぎると、仕事の一つひとつが試験のようになってしまいます。本来は流していい小さな出来事まで重く受け止め、実際の作業だけでなく“見られ方の処理”でも疲れていくんです。', 'よく見られたいというより、雑に見られたくなかっただけなんですよね。ちゃんとやっていることを、ちゃんと受け取ってほしかった。その気持ちは、すごく自然です。だからこそ、評価が曖昧な場ほど削られやすかったはずです。', '今日あった出来事を一つだけ振り返って、「事実」と「自分の解釈」を分けてメモしてみてください。評価へのしんどさは、解釈がふくらみすぎたときに強くなります。'],
  D: ['ちゃんとしなきゃで疲れるタイプ', 'あなたのしんどさの正体は、『丁寧さ』が休みなく働いていることです', '抜け漏れが怖い。確認不足と思われたくない。少しでも不安があると、もう一度見直す。提出前に何度も見返す、終わったあとも気になる、雑に出したくない。あなたは、仕事を雑に扱えない人です。その真面目さが、周囲からの信頼につながってきたことも多いはずです。\n\nただ、その丁寧さがいつもフル稼働だと、心はかなり疲れます。八割で十分な仕事にも百点を出そうとしてしまう。ミスを防ぐために気を張り続ける。やること以上に、「ちゃんとやるための神経」が先に減っていくんです。今のしんどさは、能力不足ではなく、むしろ「ちゃんとしようとし続けてきた反動」に近いものです。', '雑にやれないのは、あなたの誠実さです。その姿勢に助けられてきた人は確実にいます。でも、毎回それを全力でやるのは本当に消耗します。仕事が終わってからも少し張りつめたままの人ほど、疲れは深くなります。', '今日の仕事の中で一つだけ、「ここは八割で出す」と決めてみてください。全部を百点で出し続けないことが、長く働くための現実的な工夫になります。'],
  E: ['境界線が薄くなりやすいタイプ', 'あなたのしんどさの正体は、『自分の仕事の外側』まで引き受けていることです', '本来は自分の担当ではないことまで、なんとなく手を出してしまう。断ればいいとわかっていても、その場の流れや相手への気遣いで引き受けてしまう。少し手伝うつもりが、そのまま自分の持ち分みたいになっていく。あなたは、仕事の境界線をやわらかく保とうとする人です。\n\nその姿勢は、チームワークの面では強みです。でも境界線が薄いままだと、負担の整理がつかなくなります。自分の役割が増えているのに、はっきり増えた感覚が持てないまま疲弊していくんです。「何がこんなに重いのか」が説明しづらいのは、そのせいかもしれません。見えない足し算で疲れていくタイプとも言えます。', '協力しようとしてきたんですよね。冷たくしたかったわけでも、断りたかったわけでもない。ただ、ずっと譲りすぎてきただけなんです。その優しさの代償が、今の疲れとして出ています。', 'まずは一つ、「それは今の自分の担当か？」と心の中で確認する癖をつけてみてください。引き受ける前に一拍置くだけで、境界線は少しずつ戻せます。'],
  F: ['言えない不満が溜まりやすいタイプ', 'あなたのしんどさの正体は、『飲み込んできた言葉』が静かに積もっていることです', '本当は嫌だった。納得していなかった。でも言うほどではないと思ってきた。角が立つよりは自分が我慢した方が早い。そんな選択を積み重ねてきたのではないでしょうか。小さい違和感の時点では飲み込めてしまうぶん、大きな不満になるまで自分でも気づきにくかったかもしれません。あなたは、場を壊さないために本音を奥へしまう人です。\n\n言わなかったことは、その場では正解に見えることがあります。でも、言えなかった気持ちは消えません。静かに残り続けて、別の疲れとして体に出てきます。あとから別のことにもイライラしたり、仕事そのものより「人とのやり取り」で急に重くなったりするのは、その積み残しがあるからかもしれません。', 'よく飲み込んできましたね。言わない方が丸く収まるとわかっている人ほど、自分の中だけが荒れていくんです。あなたはちゃんと、しんどくていいです。', 'いきなり職場で全部言わなくて大丈夫です。まずはノートやスマホのメモに、本当は嫌だったことを一つだけ言葉にしてみてください。外に出すだけでも、かなり違います。'],
  G: ['先回りで消耗しやすいタイプ', 'あなたのしんどさの正体は、『まだ起きていないこと』まで先に働いていることです', 'これを言ったらどう思われるか。次の会議で詰められないか。失敗したらどうなるか。まだ現実には起きていないことを、先に何パターンも考えてしまう。あなたは、先を読む力が強い人です。返事が来る前から補足を考えたり、指摘される前に複数の防御線を張ったり、起きていない場面で先に働いていることが多いのではないでしょうか。\n\nその力は、本来とても有能です。危険を避けたり、準備を整えたりするのに役立つからです。でも、先回りが強すぎると、実際の業務よりも「想像の中の仕事」で疲れてしまいます。目の前の仕事がひとつでも、頭の中では何通りもの展開を同時に処理している状態だからです。心が休まらないのは、常に少し先の未来で働いているからなんです。', 'ちゃんと備えようとしてきたんですよね。考えすぎと言われても、考えないと不安だった。その慎重さに助けられてきた場面も、きっとたくさんありました。だからこそ、見えないところで先に疲れていたはずです。', '不安が出たら、「今すぐできる準備」と「まだ考えなくていいこと」に分けてみてください。先の全部を今日処理しようとしないだけで、かなり楽になります。'],
  H: ['限界が見えにくいタイプ', 'あなたのしんどさの正体は、『疲れていることを後回しにし続けてきたこと』です', 'まだ大丈夫。みんなこんなもの。今だけだから。そう思って走ってきた結果、自分の疲れを感じ取るセンサー自体が鈍っているのかもしれません。明確な不満はないのに元気が出ない、休んでもすっきりしない、何が原因かもよくわからない。そんな状態が続いていませんか。人から見ると普通に働けているぶん、自分でも「まだいける」と判断しやすかったのかもしれません。\n\n人は限界を超えると、むしろ鈍くなります。危険信号を感じにくくなるんです。だから「まだ働けている」ことと「余裕がある」ことは同じではありません。しんどさが言葉にならない、休んでも戻りきらない、週末でも完全に切れない。そういうぼんやりした不調の形で出ることもあります。今のあなたに必要なのは、もっと頑張ることではなく、まず自分の状態を正確に認識することです。', '気づけないくらい、ずっと頑張ってきたんですよね。立ち止まる理由を探さなくていいです。しんどいかもしれない、と思えた時点で、もう十分大事なサインです。理由が曖昧でも、疲れは軽いとは限りません。', '今日は帰宅後に、仕事のことを考える前に「今の疲れを10点満点で何点か」だけつけてみてください。曖昧な疲れを数字にするだけでも、限界の見え方が変わります。']
};

const AFF_HINT = {
  A: '場の空気まで背負いやすいときに、神経を少しゆるめる補助として置いています。',
  B: '仕事を持ちすぎる流れを、少し戻したいときの入口として置いています。',
  C: '評価で削られやすいときに、自分の軸を戻す補助として合いやすい内容です。',
  D: '丁寧さを責めずに、力の抜きどころをつくりたいときに向いています。',
  E: '引き受けすぎる流れに一拍置きたいときの補助として置いています。',
  F: '飲み込んだ本音を少し外へ出す助けとして使いやすい一冊です。',
  G: '先回りでふくらみやすい不安を、今のサイズに戻したいときに向いています。',
  H: '曖昧な疲れを見える形にしたいときの入口として置いています。'
};

const TYPE_MAX = { A: 18, B: 17, C: 13, D: 14, E: 9, F: 9, G: 11, H: 13 };

function calc() {
  const scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0 };
  answers.forEach((answer) => {
    Object.entries(answer).forEach(([key, value]) => {
      scores[key] += value;
    });
  });
  const sorted = Object.entries(scores).sort((a, b) => {
    const ratioA = TYPE_MAX[a[0]] ? a[1] / TYPE_MAX[a[0]] : 0;
    const ratioB = TYPE_MAX[b[0]] ? b[1] / TYPE_MAX[b[0]] : 0;
    if (ratioB !== ratioA) return ratioB - ratioA;
    return b[1] - a[1];
  });
  return {
    main: sorted[0][0],
    sub: sorted[1][0],
    ratios: Object.fromEntries(sorted.map(([key, value]) => [key, TYPE_MAX[key] ? value / TYPE_MAX[key] : 0]))
  };
}

function share(main) {
  const url = 'https://shindan-lab.github.io/shokuba-karte/';
  return `私は「${T[main][0]}」でした。あなたの職場しんどさを診断。\n\n▼職場しんどいカルテ\n${url}\n\n#職場しんどいカルテ #診断Lab`;
}

function ensureDynamicBlocks() {
  const affCard = document.getElementById('aff');

  if (!document.getElementById('affnote')) {
    const note = document.createElement('div');
    note.id = 'affnote';
    note.className = 'sub';
    note.style.marginBottom = '12px';
    affCard.insertBefore(note, document.getElementById('afflink'));
  }
}

let i = 0;
let answers = [];

function sc(id) {
  ['top', 'quiz', 'loading', 'result'].forEach((sectionId) => {
    document.getElementById(sectionId).classList.add('hide');
  });
  document.getElementById(id).classList.remove('hide');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  document.getElementById('ptext').textContent = `${i + 1} / ${Q.length}`;
  document.getElementById('pbar').style.width = `${((i + 1) / Q.length) * 100}%`;
  document.getElementById('backbtn').disabled = i === 0;
  document.getElementById('q').textContent = Q[i][0];

  const options = document.getElementById('opts');
  options.innerHTML = '';
  Q[i][1].forEach((item) => {
    const button = document.createElement('button');
    button.className = 'opt';
    button.textContent = item[0];
    button.onclick = () => {
      answers[i] = item[1];
      if (i < Q.length - 1) {
        i += 1;
        render();
        return;
      }
      sc('loading');
      setTimeout(show, 1200);
    };
    options.appendChild(button);
  });
}

function start() {
  i = 0;
  answers = [];
  sc('quiz');
  render();
}

function back() {
  if (i > 0) {
    i -= 1;
    render();
  }
}

function show() {
  const result = calc();
  const main = T[result.main];
  ensureDynamicBlocks();

  document.getElementById('result-accent').style.background = typeColors[result.main].gradient;
  document.getElementById('result-type-name').textContent = main[0];
  document.getElementById('result-type-image').src = TYPE_IMAGE[result.main];
  document.getElementById('result-type-image').alt = `${main[0]}のイメージ画像`;
  document.getElementById('headline').textContent = main[1];
  document.getElementById('body').innerHTML = main[2].split('\n\n').map((paragraph) => `<p>${paragraph}</p>`).join('');

  document.getElementById('letter').textContent = main[3];
  document.getElementById('pres').textContent = main[4];
  const affiliate = (
    typeof affiliateData !== 'undefined' &&
    affiliateData &&
    affiliateData[result.main] &&
    typeof affiliateData[result.main].url === 'string' &&
    affiliateData[result.main].url.trim() !== ''
  ) ? affiliateData[result.main] : null;

  if (affiliate) {
    document.getElementById('aff').classList.remove('hide');
    document.getElementById('affnote').textContent = AFF_HINT[result.main];
    document.getElementById('afft').textContent = affiliate.title;
    document.getElementById('affd').textContent = affiliate.desc;
    document.getElementById('afflink').href = affiliate.url;
  } else {
    document.getElementById('aff').classList.add('hide');
  }

  const shareText = encodeURIComponent(share(result.main));
  document.getElementById('sx').href = `https://twitter.com/intent/tweet?text=${shareText}`;
  document.getElementById('st').href = `https://www.threads.net/intent/post?text=${shareText}`;
  sc('result');
}

function resetQuiz() {
  sc('top');
}
