const T = {
  A: ['余裕切れ反応タイプ', '怒りの正体は、性格のきつさではなく「余裕の残量」がかなり減っていることかもしれません', '朝から予定が崩れる。呼ばれる。こぼれる。泣かれる。何かひとつなら受け止められることでも、重なると急に声が強くなる。そんな日があるのではないでしょうか。\n\nこのタイプのイライラは、子どもが嫌だから起きるものではありません。反応する余白がもう少ない状態で、次の出来事が来てしまうから起きます。普段なら流せることが流せない。優しく言いたいのに、短い言葉しか出てこない。あなたが悪いというより、余裕が空になるまで動き続けていた可能性があります。', '本当はもっとやわらかく言いたかったんですよね。怒りたい人ではなく、余裕がない中で何とか回してきた人なんだと思います。', '今日は「怒らない」より先に、ひとつだけ負荷を減らしてみてください。夕飯を簡単にする、片づけを後回しにする、返事を一拍置く。それだけでも反応は少し変わります。'],
  B: ['ひとり背負いタイプ', 'イライラの奥には、「自分ばかりが回している」という偏りの疲れがあるのかもしれません', '子どものこと、家のこと、明日の準備、細かい確認。誰かに頼む前に自分が気づいてしまう。気づくから動く。動くから、また自分の担当みたいになっていく。そんな流れが続いていませんか。\n\nこのタイプのイライラは、目の前の子どもへの怒りだけではありません。「なぜ私だけが覚えているのか」「なぜ私だけが先に動くのか」という負担の偏りが、静かに積み上がったものです。ちゃんと回せる人ほど、周りからは大丈夫そうに見えます。でも、内側ではずっと持ちすぎていたのかもしれません。', 'ここまで本当によく回してきました。できてしまう人ほど、しんどさが見えにくいんですよね。', '今日ひとつだけ、「これは私が今すぐ持たなくていいかも」と線を引いてみてください。頼む前に、まず自分の中で持ちすぎを確認するだけでも一歩です。'],
  C: ['切り替え不能タイプ', '一度崩れた流れを戻すための力が、かなり消耗しているのかもしれません', '朝の支度がずれる。寝かしつけが長引く。片づけたそばから散らかる。そこで一度イライラすると、次の場面まで気持ちが残ってしまう。そんなことがあるかもしれません。\n\nこのタイプは、出来事そのものより「流れが切れたあとに戻す負荷」で疲れやすい状態です。育児は中断の連続です。途中で止められ、呼ばれ、予定が変わる。そのたびに気持ちを戻すのは、思っている以上に大きな作業です。切り替えが苦手なのではなく、切り替えを求められる回数が多すぎるのかもしれません。', '何度も立て直してきたんですよね。うまく切り替えられない日があるのは、あなたの未熟さではなく、戻す回数が多すぎたからかもしれません。', 'イライラしたあとにすぐ機嫌を直そうとしなくて大丈夫です。まずは水を飲む、深呼吸する、別の部屋に一歩移動するなど、小さな区切りを作ってみてください。'],
  D: ['察してほしい限界タイプ', '「手伝って」より前に、「気づいてほしかった」が積もっているのかもしれません', '言えばいいとわかっている。でも、毎回言わないと動かないこと自体に疲れる。子どものことも家のことも、見ればわかるはずなのにと思ってしまう。そんな気持ちが出ることはありませんか。\n\nこのタイプのイライラは、単なる不満ではありません。説明し続ける疲れ、頼む前に状況を整理する疲れ、気づいてもらえなかった寂しさが重なっています。怒りの形で出ていても、奥には「一緒に見てほしい」「同じ温度で気づいてほしい」という願いがあるのかもしれません。', '本当は責めたいというより、一緒に背負ってほしかったんですよね。言わないと伝わらないことが続くと、しんどくなるのは自然です。', '次に頼むときは、「これをやって」だけでなく「今、手が足りない」と状態も一言足してみてください。気づいてほしい気持ちを、少しだけ言葉に置き換える練習です。'],
  E: ['刺激過多タイプ', '音や散らかりや呼びかけが重なって、頭の中の余白が埋まりやすいのかもしれません', '泣き声、動画の音、きょうだいの声、散らかった床、何度も呼ばれる声。ひとつひとつは小さくても、同時に来ると急に限界が近づく。そんな感覚があるかもしれません。\n\nこのタイプのイライラは、心の狭さではありません。刺激を処理する量が多すぎる状態です。育児中の家は、音も物も判断も増えやすい場所です。ずっと反応し続けていれば、頭が休まらなくなるのは当然です。怒りに見えているものは、実は「もう入ってこないで」というサインに近いのかもしれません。', '静かな時間がほしいと思うのは、子どもを遠ざけたいからではありません。あなたの頭と心に、反応しない時間が必要なだけです。', '5分だけでも音を減らす時間を作ってみてください。テレビを消す、イヤホンを外す、ひとつだけ片づける。刺激を減らすことは、立派な回復です。'],
  F: ['自分時間不足タイプ', '自分のために使える時間が足りず、心の回復が追いついていないのかもしれません', 'トイレもお風呂もゆっくりできない。好きなことを始めてもすぐ中断される。自分の時間が細切れになりすぎて、気づくと何も満たされないまま一日が終わる。そんな日が続いていませんか。\n\nこのタイプのイライラは、わがままではありません。自分を戻す時間が足りないまま、人のために動き続けている状態です。少しの自由や一人時間がないと、人はやさしさを出し続けるのが難しくなります。子どもに向いた怒りに見えても、奥では「私の時間も少しほしい」という自然な欲求が削られているのかもしれません。', '自分の時間がほしいと思うことに、罪悪感を持たなくて大丈夫です。あなたが戻る時間は、家のためにも必要です。', '今日は10分だけ「誰かのためではない時間」を先に決めてみてください。スマホでもお茶でも何でもいいです。自分の気持ちに戻る小さな時間を予定に入れることが大切です。'],
  G: ['ちゃんと育てなきゃタイプ', 'イライラの奥に、「ちゃんと向き合わなきゃ」という強い責任感があるのかもしれません', '怒りたくない。ちゃんと受け止めたい。よくない言い方をしたくない。そう思うほど、できなかった日に自分を責めてしまう。そんなことはありませんか。\n\nこのタイプは、子どもを大切に思っているからこそ疲れやすい状態です。育児情報、周りの目、自分の理想。いろいろな「ちゃんと」が積み重なると、子どもと向き合う時間そのものが試験のようになってしまいます。怒りの奥には、失敗したくない気持ちや、いい親でいたい気持ちがあるのかもしれません。', 'ちゃんとしたいと思っている時点で、あなたは十分向き合っています。完璧にできない日があることと、大切にしていないことは別です。', '今日は「ちゃんと」をひとつだけ減らしてみてください。食事、片づけ、声かけ。全部を満点にしなくても、親子の一日は続いていきます。'],
  H: ['あと悔やみタイプ', '怒ったあとに自分を責める時間が長く、心が休まらなくなっているのかもしれません', '怒っている瞬間より、その後の後悔の方がつらい。寝顔を見て落ち込む。あんな言い方しなければよかったと何度も思い出す。そんなことがあるかもしれません。\n\nこのタイプのイライラは、怒りそのものだけでなく「怒った後の自責」でさらに疲れやすい状態です。反省できるのは大切な力です。でも、毎回自分を責め続けると、回復する前に次の育児が始まってしまいます。後悔が強い人ほど、実は子どもを大事に思っている人でもあります。', '言いすぎたかもと思えるのは、あなたが関係を大切にしているからです。責め続けるより、戻り方を持つ方が親子には効きます。', '怒ったあとは、長い反省より短い修復を意識してみてください。「さっき強く言いすぎたね」「大事だから言ったけど、声は大きかったね」など、一言戻すだけでも十分です。']
};

  A: '余裕が切れやすい日に、まず自分を戻すための補助として置いています。',

  F: '自分時間を取り戻すきっかけとして置いています。',

  H: '怒った後の自責から、修復に気持ちを戻すための補助として置いています。'
};

const TYPE_MAX = Q.reduce((max, question) => {
  Object.entries(question[1]).forEach(([key, value]) => {
    max[key] = (max[key] || 0) + value * LEVELS[0].weight;
  });
  return max;
}, { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0 });

function calc() {
  const scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0 };
  answers.forEach((answer) => {
    Object.entries(answer).forEach(([key, value]) => {
      scores[key] += value;
    });
  });
  const total = Object.values(scores).reduce((sum, value) => sum + value, 0);
  if (total === 0) {
    return {
      main: 'F',
      sub: 'A',
      scores,
      ratios: Object.fromEntries(Object.keys(scores).map((key) => [key, 0]))
    };
  }
  const sorted = Object.entries(scores).sort((a, b) => {
    const ratioA = TYPE_MAX[a[0]] ? a[1] / TYPE_MAX[a[0]] : 0;
    const ratioB = TYPE_MAX[b[0]] ? b[1] / TYPE_MAX[b[0]] : 0;
    if (ratioB !== ratioA) return ratioB - ratioA;
    return b[1] - a[1];
  });
  return {
    main: sorted[0][0],
    sub: sorted[1][0],
    scores,
    ratios: Object.fromEntries(sorted.map(([key, value]) => [key, TYPE_MAX[key] ? value / TYPE_MAX[key] : 0]))
  };
}

function share(main) {
  const url = 'https://shindan-lab.github.io/ikuji-iraira/';
  return `私は「${T[main][0]}」でした。育児イライラの正体を診断。\n\n▼育児イライラの正体診断\n${url}\n\n#育児イライラの正体診断 #診断Lab`;
}

function ensureDynamicBlocks() {
  const affCard = document.getElementById('aff');
  if (!document.getElementById('affnote')) {
    const note = document.createElement('div');
    note.id = 'affnote';
    note.className = 'sub';
    note.style.marginBottom = '12px';
    affCard.insertBefore(note, document.getElementById('afflink'));
  }
}

let i = 0;
let answers = [];

function sc(id) {
  ['top', 'quiz', 'loading', 'result'].forEach((sectionId) => {
    document.getElementById(sectionId).classList.add('hide');
  });
  document.getElementById(id).classList.remove('hide');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  document.getElementById('ptext').textContent = `${i + 1} / ${Q.length}`;
  document.getElementById('pbar').style.width = `${((i + 1) / Q.length) * 100}%`;
  document.getElementById('backbtn').disabled = i === 0;
  document.getElementById('q').textContent = Q[i][0];
  const options = document.getElementById('opts');
  options.innerHTML = '';
  LEVELS.forEach((level) => {
    const button = document.createElement('button');
    button.className = 'opt';
    button.innerHTML = `${level.label}<span class="opt-sub">${level.sub}</span>`;
    button.onclick = () => {
      answers[i] = Object.fromEntries(
        Object.entries(Q[i][1]).map(([key, value]) => [key, value * level.weight])
      );
      if (i < Q.length - 1) {
        i += 1;
        render();
        return;
      }
      sc('loading');
      setTimeout(show, 1200);
    };
    options.appendChild(button);
  });
}

function start() {
  i = 0;
  answers = [];
  sc('quiz');
  render();
}

function back() {
  if (i > 0) {
    i -= 1;
    render();
  }
}

function show() {
  const result = calc();
  const main = T[result.main];
  ensureDynamicBlocks();
  document.getElementById('result-accent').style.background = typeColors[result.main].gradient;
  document.getElementById('result-type-name').textContent = main[0];
  document.getElementById('result-type-image').src = TYPE_IMAGE[result.main];
  document.getElementById('result-type-image').alt = `${main[0]}のイメージ画像`;
  document.getElementById('headline').textContent = main[1];
  document.getElementById('body').innerHTML = main[2].split('\n\n').map((paragraph) => `<p>${paragraph}</p>`).join('');
  window.renderDeepResult({ result, types: T, questions: Q, answers, depth: window.RESULT_DEPTH, subInfluence: window.RESULT_SUB_INFLUENCE });
  document.getElementById('letter').textContent = main[3];
  document.getElementById('pres').textContent = main[4];
  const affiliate = (
    typeof affiliateData !== 'undefined' &&
    affiliateData &&
    affiliateData[result.main] &&
    typeof affiliateData[result.main].url === 'string' &&
    affiliateData[result.main].url.trim() !== ''
  ) ? affiliateData[result.main] : null;
  if (affiliate) {
    document.getElementById('aff').classList.remove('hide');
    document.getElementById('affnote').textContent = AFF_HINT[result.main];
    document.getElementById('afft').textContent = affiliate.title;
    document.getElementById('affd').textContent = affiliate.desc;
    document.getElementById('afflink').href = affiliate.url;
  } else {
    document.getElementById('aff').classList.add('hide');
  }
  const shareText = encodeURIComponent(share(result.main));
  document.getElementById('sx').href = `https://twitter.com/intent/tweet?text=${shareText}`;
  document.getElementById('st').href = `https://www.threads.net/intent/post?text=${shareText}`;
  sc('result');
}
