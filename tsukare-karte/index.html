  <script>
const typeColors = {
  A: { gradient: 'linear-gradient(135deg,#7C3AED 0%,#A78BFA 100%)' },
  B: { gradient: 'linear-gradient(135deg,#DB2777 0%,#F472B6 100%)' },
  C: { gradient: 'linear-gradient(135deg,#DC2626 0%,#F87171 100%)' },
  D: { gradient: 'linear-gradient(135deg,#D97706 0%,#FBBF24 100%)' },
  E: { gradient: 'linear-gradient(135deg,#2563EB 0%,#60A5FA 100%)' },
  F: { gradient: 'linear-gradient(135deg,#6D28D9 0%,#A78BFA 100%)' },
  G: { gradient: 'linear-gradient(135deg,#059669 0%,#34D399 100%)' },
  H: { gradient: 'linear-gradient(135deg,#6B7280 0%,#9CA3AF 100%)' }
};

const LEVELS = [
  { label: 'とても当てはまる', sub: 'かなり近い', weight: 3 },
  { label: '少し当てはまる', sub: 'まあ近い', weight: 2 },
  { label: 'あまり当てはまらない', sub: '少し違う', weight: 1 },
  { label: 'ほとんど当てはまらない', sub: 'かなり違う', weight: 0 }
];

const Q = [
  ['予定外のことが重なると、自分が全体をつなぎ直そうとしやすい', { A: 3 }],
  ['人の表情や場の空気の変化に、気づきすぎて疲れることがある', { B: 3 }],
  ['小さな抜けや中途半端さが残ると、何度も整えたくなる', { C: 3 }],
  ['本当は嫌だったことも、その場では飲み込んでしまいやすい', { D: 3 }],
  ['まだ起きていないことまで考えて、先に疲れてしまう', { E: 3 }],
  ['期待されている役割に合わせて、自分を後回しにしやすい', { F: 3 }],
  ['休む時間があっても、頭や気持ちの余白が戻りにくい', { G: 3 }],
  ['しんどさに気づく頃には、かなり溜まっていることが多い', { H: 3 }],
  ['頼まれる前から、足りないところを自分が埋めようとしてしまう', { A: 2, F: 1 }],
  ['連絡や通知が続くと、返し方や相手の反応を考え続けてしまう', { B: 1, E: 2 }],
  ['その場では平気なふりをして、後からじわじわ重くなる', { D: 2, H: 1 }],
  ['何もしない時間にも、気になることが残って落ち着きにくい', { G: 2, C: 1 }]
];

const T = {
  A: ['背負い込み疲れタイプ', '気づくといつも、自分が最後の受け皿になっているのかもしれません', '気づいたら、自分がつなぎ役になっている。抜けた穴を埋める側に回っている。家でも仕事でも、「これを止めると全体が回りにくい」と感じた瞬間に、自分の手を出してきたのではないでしょうか。頼られたときに断れないというより、頼まれる前から持ったほうが早いと判断してきたのかもしれません。あなたは、責任感と処理力があるぶん、自然に負荷を引き受けやすい人です。\n\nこの疲れは、単純な忙しさだけではありません。周りが楽をしているからでも、あなたが弱いからでもない。『持てる人のところに集まる』『回せる人に穴埋めが寄る』という構造の中で、ずっと稼働し続けてきた結果に近いものです。だから休んでも、ただ体力が戻るだけでは軽くなりきらないことがあります。持つ前提そのものが続いているからです。', 'ちゃんと回してきた人ほど、止まる理由を持ちにくいんですよね。周りには頼れる人に見えていても、内側では「もう一個来たらきつい」がずっと続いていたはずです。', '今日ひとつだけ、頼まれごとに即答しないでみてください。「確認してから返します」を挟むだけでも、背負い込みの流れは少し変えられます。'],
  B: ['気配キャッチ疲れタイプ', 'あなたは、言葉より先に空気の変化を受け取ってしまう人なのかもしれません', '誰かの機嫌、場の温度、言葉の裏にあるニュアンス。少し返事が遅い、いつもより声が固い、家の空気がなんとなく重い。あなたは、表に出ていないものをかなり早く察知する人です。それは気配りの力でもあり、人の変化に先に気づける繊細さでもあります。\n\nでも、その感度が開いたままだと、自分の仕事や自分の用事以外の感情まで処理することになります。自分が何か悪かったのかを考えたり、場が荒れないよう先回りしたり、相手の不機嫌を少しでも和らげようとしたり。本来は背負わなくていい空気まで受け取り続けていれば、消耗するのは当然です。疲れているのは、気にしすぎだからではなく、拾えてしまうからです。', '敏感さは弱さではありません。ずっと気配を拾えるままでいたら、疲れるのは自然です。あなたが悪いわけではなく、感度の高いまま長時間働いてきただけです。', '今日は一度だけ、「これは自分の役目ではない」と心の中で線を引いてみてください。全部に反応しない時間が、回復の入口になります。'],
  C: ['仕上げすぎ疲れタイプ', 'ちゃんとやろうとする力が、休み時間まで働き続けていたのかもしれません', '抜け漏れを出したくない。中途半端な状態で渡したくない。見直せるなら、もう一度見ておきたい。送信前に余計に確認する、提出後もしばらく気になる、ちょっとした違和感を放置しにくい。あなたは、物事を雑に扱えない人です。その姿勢は、信頼や安心感として周りにも伝わってきたはずです。\n\nただ、その丁寧さが常に全力だと、心の休みどころがなくなります。八割で十分な場面でも、最後まで仕上げ切ろうとしてしまう。やることそのものより、「ちゃんと終わらせるための神経」が先に削れていくんです。今しんどいのは、能力不足だからではなく、むしろ『ちゃんとやり続けてきた反動』に近い状態です。', '雑にできないのは、あなたの誠実さです。その誠実さに助けられてきた人は確実にいます。でも、毎回フル出力のままでは持ちません。終わったあとまで気が張ってしまう人ほど、消耗は深くなります。', '今日のどこか一か所で、「ここは仕上げ切らなくていい」と決めてみてください。少し残すことが、手を抜くことと同じではないと体に覚えさせる時間です。'],
  D: ['飲み込み疲れタイプ', '言わなかったことが、そのまま静かな重さになって残っているのかもしれません', '本当はひっかかっていた。少し嫌だった。違和感もあった。でも、言うほどではないと思ってやり過ごしてきた。「今ここで言うと面倒になる」「私が飲み込んだ方が早い」が先に出やすい。あなたは、場を荒らさないために本音を奥へしまいやすい人です。\n\nその選び方は、その場を丸く収める力にもなります。ただ、飲み込んだ気持ちは消えません。表には出なくても、あとから別の場面で急にしんどくなったり、相手とは別のことにまでイライラが残ったり、自分でも理由がわからない重さとして出てくることがあります。今のしんどさは、怠けや甘えではなく、ずっと後回しにしてきた反応が静かに溜まったものかもしれません。', '言わない方が早いとわかっている人ほど、自分の中だけが荒れていくんですよね。ここまでよく耐えてきました。丸く収めてきた分だけ、あなたの中には残りやすかったはずです。', 'いきなり相手に伝えなくて大丈夫です。まずは「本当は嫌だったこと」を一つだけ言葉にして、メモに残してみてください。飲み込んだままにしない練習になります。'],
  E: ['先回り不安疲れタイプ', 'まだ起きていない先のことまで、心が先に働き続けていたのかもしれません', 'これを言ったらどう受け取られるか。次に何が起きるか。失敗したらどこまで影響するか。あなたは、現実より少し先の場面を何通りも想像できる人です。返事が来る前から次の説明を考える、まだ起きていないトラブルの穴埋めまで頭の中で始めてしまう。その力は、準備や危険回避において確かな強みでもあります。\n\nただ、先回りが強く働きすぎると、まだ起きていない出来事の処理で先に疲れてしまいます。実際の出来事はひとつなのに、心の中では何本もの分岐を同時に走っている状態です。だから、やることが終わっても気持ちだけが終わらない。休まらないのは、心が常に少し先の未来で働いているからかもしれません。', 'ちゃんと備えようとしてきたんですよね。考えないと不安だったからこそ、ここまで回してこられた面もあるはずです。でも、頭の中で先に働き続けるのはそれだけで疲れます。', '不安が出たら、「今すぐ手をつけること」と「まだ起きていないこと」を分けてみてください。先の全部を今日の仕事にしないだけで、かなり違います。'],
  F: ['期待適応疲れタイプ', 'ちゃんと応えようとするほど、自分の輪郭が後ろへ下がっていたのかもしれません', 'ちゃんとしていたい。がっかりさせたくない。求められている役割にはきちんと応えたい。あなたは、人に対して誠実で、期待された位置に自然と自分を合わせられる人です。頼まれたことに応えるだけでなく、「ここではこう振る舞うのがよさそう」を先に読んで、その形へ自分を寄せてきたのではないでしょうか。\n\nでも、それが続くと、「自分はどうしたいか」より「どう見られるか」「何を期待されているか」が先に立ちやすくなります。断ることより合わせることが早くなり、休むことより応えることが先になります。今のしんどさは、わがままの不足ではなく、むしろ合わせる力が高すぎた反動に近いものです。', '期待に応えられる人ほど、自分の疲れを後回しにしやすいんですよね。ちゃんとしてきたからこそ、今しんどいのは自然です。気づく頃には、自分の基準がかなり後ろへ下がっていたはずです。', '今日は一つだけ、「相手が望みそうなこと」ではなく「今の自分に無理がないこと」で選んでみてください。小さくても、自分に戻る練習になります。'],
  G: ['余白切れ疲れタイプ', '休んでいても戻らないのは、余白そのものが足りなくなっていたからかもしれません', '予定が詰まり切っているわけではないのに、気が休まらない。何もしていない時間にも、情報を見たり考えごとをしたりして、頭の反応だけは止まらない。休んでいるはずの時間まで、次の段取りや通知や小さな判断で埋まりやすい。あなたは、体力より先に余白の不足で消耗しやすいタイプかもしれません。\n\nこの疲れに必要なのは、派手な気分転換より、まず刺激を減らすことです。何かを足すより、少し引く。情報、会話、判断、予定。そうした反応量が減ってはじめて、回復が動き出しやすいタイプです。だから「休んでいるのに戻らない」と感じやすいのは、休み時間そのものではなく、休み方の中にまだ反応が多く残っているからかもしれません。', '何もしない時間が必要なのは、甘えではなく回復条件です。余白がないまま走ってきたなら、しんどいのは当然です。あなたには、空いた時間ではなく「空けた時間」が必要なんだと思います。', '今日は10分だけでも「何も足さない時間」をつくってみてください。スマホも予定も閉じて、反応しない時間を先に確保するのが効きます。'],

};

const TYPE_MAX = Q.reduce((max, question) => {
  Object.entries(question[1]).forEach(([key, value]) => {
    max[key] = (max[key] || 0) + value * LEVELS[0].weight;
  });
  return max;
}, { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0 });

function calc() {
  const scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0 };
  answers.forEach((answer) => {
    Object.entries(answer).forEach(([key, value]) => {
      scores[key] += value;
    });
  });
  const total = Object.values(scores).reduce((sum, value) => sum + value, 0);
  if (total === 0) {
    return {
      main: 'H',
      sub: 'G',
      scores,
      ratios: Object.fromEntries(Object.keys(scores).map((key) => [key, 0]))
    };
  }
  const sorted = Object.entries(scores).sort((a, b) => {
    const ratioA = TYPE_MAX[a[0]] ? a[1] / TYPE_MAX[a[0]] : 0;
    const ratioB = TYPE_MAX[b[0]] ? b[1] / TYPE_MAX[b[0]] : 0;
    if (ratioB !== ratioA) return ratioB - ratioA;
    return b[1] - a[1];
  });
  return {
    main: sorted[0][0],
    sub: sorted[1][0],
    scores,
    ratios: Object.fromEntries(sorted.map(([key, value]) => [key, TYPE_MAX[key] ? value / TYPE_MAX[key] : 0]))
  };
}

function share(main) {
  const url = 'https://shindan-lab.github.io/tsukare-karte/';
  return `私は「${T[main][0]}」でした。あなたの疲れのタイプを診断。\n\n▼疲れのカルテ\n${url}\n\n#疲れのカルテ #診断Lab`;
}

function ensureDynamicBlocks() {
  const affCard = document.getElementById('aff');

  if (!document.getElementById('affnote')) {
    const note = document.createElement('div');
    note.id = 'affnote';
    note.className = 'sub';
    note.style.marginBottom = '12px';
    const link = document.getElementById('afflink');
    affCard.insertBefore(note, link);
  }
}

let i = 0;
let answers = [];

function sc(id) {
  ['top', 'quiz', 'loading', 'result'].forEach((sectionId) => {
    document.getElementById(sectionId).classList.add('hide');
  });
  document.getElementById(id).classList.remove('hide');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  document.getElementById('ptext').textContent = `${i + 1} / ${Q.length}`;
  document.getElementById('pbar').style.width = `${((i + 1) / Q.length) * 100}%`;
  document.getElementById('backbtn').disabled = i === 0;
  document.getElementById('q').textContent = Q[i][0];

  const options = document.getElementById('opts');
  options.innerHTML = '';
  LEVELS.forEach((level) => {
    const button = document.createElement('button');
    button.className = 'opt';
    button.innerHTML = `${level.label}<span class="opt-sub">${level.sub}</span>`;
    button.onclick = () => {
      answers[i] = Object.fromEntries(
        Object.entries(Q[i][1]).map(([key, value]) => [key, value * level.weight])
      );
      if (i < Q.length - 1) {
        i += 1;
        render();
        return;
      }
      sc('loading');
      setTimeout(show, 1200);
    };
    options.appendChild(button);
  });
}

function start() {
  i = 0;
  answers = [];
  sc('quiz');
  render();
}

function back() {
  if (i > 0) {
    i -= 1;
    render();
  }
}

function show() {
  const result = calc();
  const main = T[result.main];
  ensureDynamicBlocks();

  document.getElementById('result-accent').style.background = typeColors[result.main].gradient;
  document.getElementById('result-type-name').textContent = main[0];
  document.getElementById('result-type-image').src = TYPE_IMAGE[result.main];
  document.getElementById('result-type-image').alt = `${main[0]}のイメージ画像`;
  document.getElementById('headline').textContent = main[1];
  document.getElementById('body').innerHTML = main[2].split('\n\n').map((paragraph) => `<p>${paragraph}</p>`).join('');

  document.getElementById('letter').textContent = main[3];
  document.getElementById('pres').textContent = main[4];
  const affiliate = (
    typeof affiliateData !== 'undefined' &&
    affiliateData &&
    affiliateData[result.main] &&
    typeof affiliateData[result.main].url === 'string' &&
    affiliateData[result.main].url.trim() !== ''
  ) ? affiliateData[result.main] : null;

  if (affiliate) {
    document.getElementById('aff').classList.remove('hide');
    document.getElementById('affnote').textContent = AFF_HINT[result.main];
    document.getElementById('afft').textContent = affiliate.title;
    document.getElementById('affd').textContent = affiliate.desc;
    document.getElementById('afflink').href = affiliate.url;
  } else {
    document.getElementById('aff').classList.add('hide');
  }

  const shareText = encodeURIComponent(share(result.main));
  document.getElementById('sx').href = `https://twitter.com/intent/tweet?text=${shareText}`;
  document.getElementById('st').href = `https://www.threads.net/intent/post?text=${shareText}`;
  sc('result');
}
